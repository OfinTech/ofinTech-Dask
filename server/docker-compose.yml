# OfinTech Desk Team Server with automatic HTTPS (Caddy).
#   cp .env.example .env    (set DESK_DOMAIN, ACME_EMAIL and DESK_MASTER_KEY)
#   docker compose up -d --build
name: ofintech-desk

services:
  engine:
    build: { context: .., dockerfile: server/Dockerfile }
    image: ofintech-desk:local
    restart: unless-stopped
    env_file: .env
    environment:
      DESK_MODE: server
      DESK_PUBLIC_URL: https://${DESK_DOMAIN:?set DESK_DOMAIN in .env}
      DESK_MASTER_KEY: ${DESK_MASTER_KEY:?set DESK_MASTER_KEY in .env (python -m desk_engine keygen)}
    volumes: [desk_data:/var/lib/ofintech-desk]
    tmpfs: [/tmp]                       # OCR and upload spools; nothing in the container is written anywhere else
    cap_drop: [ALL]                     # the engine needs no Linux capability: it runs as uid 10001 on port 8700
    security_opt: [no-new-privileges:true]
    expose: ["8700"]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    # Resources (reports/ai-agent-release-closure/06_RESOURCE_LIMITS.md). One engine process uses about one core when
    # busy (Python); 2 CPUs leave room for the worker threads. Peak RSS measured under 200 concurrent users was about
    # 620 MB with the load generator in the same process; 2 GB is about 3x that. Raise both for large ledgers.
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512                     # threads count as pids: the pools need tens, not hundreds
    stop_grace_period: 30s              # shutdown waits up to 10 s for worker threads before closing the database

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DESK_DOMAIN: ${DESK_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [engine]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128

volumes:
  desk_data:
  caddy_data:
  caddy_config:
