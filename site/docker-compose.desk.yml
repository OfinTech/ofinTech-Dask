# On the same server as the Team Server (desk.ofintech.ai): join its Docker network so its Caddy can reach the
# site container as "ofintech-site:8080". Start the Team Server first.
#   docker compose -f docker-compose.yml -f docker-compose.desk.yml up -d --build
services:
  site:
    networks:
      default: {}
      desk:
        aliases: [ofintech-site]

networks:
  desk:
