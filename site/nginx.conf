server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # /docs and /sign-in work as well as /docs.html, because that is how people type them and how they get written
    # down in an e-mail.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # the features page was folded into the home page, and the home page now explains itself under "how it works"
    location = /features/ { return 301 /#how; }
    location = /features  { return 301 /#how; }
    error_page 404 /404.html;

    # fonts and icons are the only things here worth caching; the pages, the stylesheet and the script are small
    # and must never go stale, so they are left to revalidate.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # script-src is 'self' rather than 'none': this site carries site.js, which switches the language and points the
    # forms at the engine. font-src is 'self' for the brand's own faces. Nothing is loaded from anywhere else, and
    # the forms may only post to the product.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'none'; form-action https://desk.ofintech.ai; frame-ancestors 'none'" always;
}
