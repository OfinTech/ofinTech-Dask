# Tests the engine and UI, builds the engine with PyInstaller on each OS, and packages the desktop
# installers with electron-builder. Signing: add the secrets listed in docs/RELEASING.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Some of these gates are about the outside world rather than the code: pip-audit and the Trivy image scan
  # both fail on advisories published after the last commit, so without a schedule the first push after one
  # appears is what finds it -- and it then looks like that push broke the build. CVE-2026-109518 in apt was
  # exactly that: Debian published the fix on 4 November and an unrelated merge on the 5th was the first build
  # to see it. A daily run separates "a new advisory landed" from "a change regressed", at the cost of one
  # Ubuntu runner. Off the hour, because scheduled runs at :00 queue behind everybody else's.
  schedule:
    - cron: "17 5 * * *"   # 08:17 in Riyadh, so the night's advisories are already triaged by the working day
  workflow_dispatch:

# Jobs get a read-only token unless they say otherwise (only `release` writes, to attach installers).
permissions:
  contents: read

jobs:
  security:
    # Security gates: every step blocks the build when it finds something. Accepted exceptions are listed in the
    # security review kept with the release record, which is not published (SECURITY.md), each with an owner and an
    # expiry date.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Secrets in the history or the tree (gitleaks)
        run: |
          # -v lists each finding (rule, file, line, commit) with the value redacted, so the log says what to fix
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --redact -v \
            --config /repo/.gitleaks.toml --exit-code 1
      - name: Static security analysis of the engine (ruff, Bandit-equivalent rules)
        working-directory: engine
        run: |
          pip install ruff==0.16.9
          # S101 (assert) and S608 (string-built SQL) were reviewed: every S608 site interpolates engine identifiers
          # or "?" placeholders only. S110/S603/S314 are accepted and listed in the roadmap with an expiry.
          ruff check --select S --ignore S101,S110,S314,S603,S608 desk_engine
      - name: Undefined names, unused imports and unused variables (ruff F)
        run: ruff check --select F engine e2e
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        working-directory: engine
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off
      - name: Known vulnerabilities in runtime npm dependencies
        run: |
          (cd ui && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high)
          (cd desktop && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: OCR and LibreOffice for the file tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara
          tesseract-ocr-spa tesseract-ocr-fra libreoffice-calc-nogui
      - name: Engine tests
        working-directory: engine
        run: |
          pip install -r requirements.txt
          # Verbose, and abort with a traceback of every thread if the suite ever hangs (OP-8).
          timeout -s ABRT 20m python -X faulthandler -m unittest discover -v -s tests -t .
      - name: UI typecheck, translations and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run i18n:check
          npm test
          node build.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist/
      - name: Two organisations on one real server (multi-tenant integration)
        run: python e2e/multi_tenant.py e2e-output/multi-tenant-evidence.json
      - name: Browser smoke test
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python e2e/ui_smoke.py e2e-output
      - name: A UI change reaches a browser that already loaded the app
        run: python e2e/bundle_cache.py
      - name: The app can be installed from the browser
        run: python e2e/installable.py
      - name: The one-line installer does what it says
        run: python e2e/install_sh.py e2e-output
      - name: Money figures stay inside their cells
        run: python e2e/figures_fit.py e2e-output
      - name: The public website (overflow, both languages, forms, error codes)
        run: python e2e/site_check.py
      - name: The website under the policy it is served with (CSP, redirects, old addresses)
        run: python e2e/site_serving.py
      - name: Session policy in a real browser (OP-12)
        run: python e2e/session_browser.py e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-evidence
          path: e2e-output/
          if-no-files-found: ignore
      - name: Desktop typecheck and security tests
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
          npm test

  sdk:
    # The embedded-agent SDK has its own tests (registry, rendering, no raw HTML, no outside calls) that no job ran.
    # It has no lockfile yet, so this installs from package.json; generate one and switch to `npm ci` later.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/embedded-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Install, typecheck, build and test the SDK
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  desktop:
    needs: test
    # The installers depend on the commit, not on the calendar, so the daily run leaves them alone: packaging on
    # three systems every night would spend the macOS and Windows minutes for a result that cannot have changed.
    # A tag or a push still builds them, and `release` waits on this job, so a tag is never released without it.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Build engine
        working-directory: engine
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          set +e
          python packaging/build_engine.py 2>&1 | tee build-engine.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # the log of this job is not readable from everywhere; an annotation and the run summary are
            msg=$(tail -n 25 build-engine.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Build engine failed::${msg}"
            { echo "### Build engine failed on ${{ matrix.os }}"; echo '```'; tail -n 80 build-engine.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: The bundle carries the demo company
        # "Try it with a demo company" reads three files that are data, not code, so nothing imports them and
        # PyInstaller takes them only because build_engine.py names them. desk_engine/demo.py looks beside the package.
        working-directory: engine
        shell: bash
        run: |
          found=$(find dist/desk-engine -path '*desk_engine/demo_company/HarborLine_General_Ledger.xlsx' | head -n 1)
          [ -n "$found" ] || { echo "::error::the engine bundle has no desk_engine/demo_company"; exit 1; }
          echo "$found"
      - name: Build UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
      - name: Package desktop app
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # A certificate variable that is defined but empty is worse than absent: electron-builder reads it
          # as a path, resolves the empty string to the project directory and stops with "<dir> not a file".
          # Each platform's variables are therefore passed on only when they hold something.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          # Only macOS looks for a signing identity, and only when it has no certificate of its own: a
          # Windows-only certificate must not send the macOS job hunting through the runner's keychain.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          args=()
          # Notarisation: electron-builder 26 skips it unless the option is set, while the 27 documentation
          # says credentials alone are enough. Passing it exactly when the credentials exist is right under
          # either, and asks for a build that fails rather than one that quietly ships un-notarised.
          if [ -n "${APPLE_ID:-}" ]; then args+=(-c.mac.notarize=true); fi
          npm ci --no-audit --no-fund
          set +e
          npm run dist -- "${args[@]}" 2>&1 | tee package.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 25 package.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Package desktop app failed::${msg}"
            { echo "### Package desktop app failed on ${{ matrix.os }}"; echo '```'; tail -n 80 package.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: ofintech-desk-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    # RELEASING.md says a vX.Y.Z tag attaches the installers to the release. Nothing did that until now:
    # the jobs above only upload them as run artifacts, which expire and are not part of any release.
    needs: [test, security, desktop, team-server-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: ofintech-desk-*
          merge-multiple: true
      - name: Release notes from the changelog
        env:
          # the same test the packaging step uses; the secret's value never reaches the shell
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " ver " " { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          if [ "$SIGNED" != "true" ]; then
            cat .github/unsigned-install.md >> notes.md   # what a person actually has to do, not just a warning
          fi
          ls -l installers
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: installers/*
          fail_on_unmatched_files: true

  team-server-image:
    needs: [test, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # The `secrets` context cannot be read in a step's `if`, so the question "is Docker Hub set up?" is asked
      # once here, as the desktop job asks about signing. The value is true or false, never the token.
      HAVE_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      # Hard-coded, not a variable. The private edition's image is `ofintech0/ofintech-desk-owner`, one word
      # away, and Docker Hub makes a repository public on its first push: a namespace that can be passed in is
      # the one mistake here that cannot be undone, so there is nothing to pass in.
      HUB_IMAGE: ofintech0/ofintech-desk
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build Team Server image
        run: |
          docker buildx build -f server/Dockerfile --platform linux/amd64 --load \
            --cache-from type=gha --cache-to type=gha,mode=max -t ofintech-desk:ci .
      - name: The image carries the demo company
        run: docker run --rm ofintech-desk:ci python -c "import sys; from desk_engine import demo; print(demo.directory()); sys.exit(0 if demo.available() else 1)"
      - name: Scan the image for known vulnerabilities (Trivy)
        # Trivy's own image, like the gitleaks step; pin the tag to a release once a maintainer has checked the
        # current one (the audit environment could not query Docker Hub).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress ofintech-desk:ci

      # arm64 is built on every push, not only when it is published. An Apple Silicon machine runs the amd64
      # image emulated and slowly, so arm64 is worth publishing -- but a platform whose first build is the
      # release is a platform that breaks the release. This step is what makes the push below safe; the time it
      # takes is in this run's log, and narrowing it to `schedule` and tags is one `if:` away.
      - name: The image builds for arm64 too
        run: |
          docker buildx build -f server/Dockerfile --platform linux/arm64 --output type=cacheonly \
            --cache-from type=gha --cache-to type=gha,mode=max .

      # ---------------------------------------------------------------- publishing, on a vX.Y.Z tag only
      # Docker Hub is the only registry (the owner's decision, 22 Nov 2026: one place to pull from, one place
      # to keep public). So a release without the two secrets has nowhere to go, and it fails here, before
      # anything is built for publishing, rather than ending green with nothing published. They are
      # *repository* secrets: this job names no environment, so a secret stored under an environment is not
      # seen and reads as empty here.
      - name: Sign in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "$HAVE_HUB" != "true" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set as repository secrets, so this release has nowhere to publish the image (Settings, Secrets and variables, Actions, Repository secrets; not under an environment)."
            exit 1
          fi
          printf '%s' "$HUB_TOKEN" | docker login -u "$HUB_USER" --password-stdin

      - name: Push the image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          names="$HUB_IMAGE"

          # `latest` and the X.Y tag move only for a plain release. v1.4.0-rc1 would otherwise hand every
          # customer who pulls `latest` a release candidate, and park it on 1.4 as well.
          which="$version sha-$(git rev-parse --short HEAD)"
          case $version in
            *[!0-9.]*|*..*) echo "::notice::$version is not a plain X.Y.Z, so latest does not move." ;;
            *.*.*) which="$which ${version%.*} latest" ;;
            *) echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1 ;;
          esac

          tags=""
          for name in $names; do
            for t in $which; do tags="$tags --tag $name:$t"; done
          done
          echo "publishing$tags"
          # The same two platforms the steps above built and checked, from the same cache.
          docker buildx build -f server/Dockerfile --platform linux/amd64,linux/arm64 --push \
            --cache-from type=gha \
            --label "org.opencontainers.image.title=OfinTech Desk Team Server" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            $tags .

      - name: Can a stranger pull what went up, on both platforms?
        if: startsWith(github.ref, 'refs/tags/v')
        # This image is meant to be public, so the check is that it IS one -- the mirror of the private
        # edition's check, which asks the same question in order to refuse. Asked with no credentials, because
        # a customer has none.
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          refs="$HUB_IMAGE:$version"
          docker logout >/dev/null 2>&1 || true
          failed=0
          for ref in $refs; do
            if ! out=$(docker buildx imagetools inspect "$ref" 2>&1); then
              echo "::error::nobody can pull $ref without credentials, so a customer cannot install Desk"
              echo "$out"
              echo "On Docker Hub this means the repository there is private: its Settings, Visibility."
              failed=1
              continue
            fi
            for platform in linux/amd64 linux/arm64; do
              printf '%s' "$out" | grep -q "$platform" \
                || { echo "::error::$ref has no $platform in its manifest"; failed=1; }
            done
            echo "ok: anyone can pull $ref, on both platforms"
          done
          exit $failed
