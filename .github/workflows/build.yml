# Tests the engine and UI, builds the engine with PyInstaller on each OS, and packages the desktop
# installers with electron-builder. Signing: add the secrets listed in docs/RELEASING.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Jobs get a read-only token unless they say otherwise (only `release` writes, to attach installers).
permissions:
  contents: read

jobs:
  security:
    # Security gates (docs/audit/09-SECURITY-TEST-RESULTS.md): every step blocks the build when it finds something.
    # Accepted exceptions are listed in docs/audit/08-REMEDIATION-ROADMAP.md with an owner and an expiry date.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Secrets in the history or the tree (gitleaks)
        run: |
          # -v lists each finding (rule, file, line, commit) with the value redacted, so the log says what to fix
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --redact -v \
            --config /repo/.gitleaks.toml --exit-code 1
      - name: Static security analysis of the engine (ruff, Bandit-equivalent rules)
        working-directory: engine
        run: |
          pip install ruff==0.16.9
          # S101 (assert) and S608 (string-built SQL) were reviewed: every S608 site interpolates engine identifiers
          # or "?" placeholders only. S110/S603/S314 are accepted and listed in the roadmap with an expiry.
          ruff check --select S --ignore S101,S110,S314,S603,S608 desk_engine
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        working-directory: engine
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict --progress-spinner off
      - name: Known vulnerabilities in runtime npm dependencies
        run: |
          (cd ui && npm install --no-audit --no-fund && npm audit --omit=dev --audit-level=high)
          (cd desktop && npm install --no-audit --no-fund && npm audit --omit=dev --audit-level=high)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: OCR and LibreOffice for the file tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ara
          tesseract-ocr-spa tesseract-ocr-fra libreoffice-calc-nogui
      - name: Engine tests
        working-directory: engine
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t .
      - name: UI typecheck, translations and build
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run i18n:check
          node build.mjs
      - name: Browser smoke test
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python e2e/ui_smoke.py e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-screenshots
          path: e2e-output/
          if-no-files-found: ignore
      - name: Desktop typecheck
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Build engine
        working-directory: engine
        shell: bash
        run: |
          pip install -r requirements-dev.txt
          set +e
          python packaging/build_engine.py 2>&1 | tee build-engine.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # the log of this job is not readable from everywhere; an annotation and the run summary are
            msg=$(tail -n 25 build-engine.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Build engine failed::${msg}"
            { echo "### Build engine failed on ${{ matrix.os }}"; echo '```'; tail -n 80 build-engine.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Build UI
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          node build.mjs
      - name: Package desktop app
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # A certificate variable that is defined but empty is worse than absent: electron-builder reads it
          # as a path, resolves the empty string to the project directory and stops with "<dir> not a file".
          # Each platform's variables are therefore passed on only when they hold something.
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          # Only macOS looks for a signing identity, and only when it has no certificate of its own: a
          # Windows-only certificate must not send the macOS job hunting through the runner's keychain.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          args=()
          # Notarisation: electron-builder 26 skips it unless the option is set, while the 27 documentation
          # says credentials alone are enough. Passing it exactly when the credentials exist is right under
          # either, and asks for a build that fails rather than one that quietly ships un-notarised.
          if [ -n "${APPLE_ID:-}" ]; then args+=(-c.mac.notarize=true); fi
          npm install --no-audit --no-fund
          set +e
          npm run dist -- "${args[@]}" 2>&1 | tee package.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 25 package.log | tr -d '\r' | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Package desktop app failed::${msg}"
            { echo "### Package desktop app failed on ${{ matrix.os }}"; echo '```'; tail -n 80 package.log; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v7
        with:
          name: ofintech-desk-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    # RELEASING.md says a vX.Y.Z tag attaches the installers to the release. Nothing did that until now:
    # the jobs above only upload them as run artifacts, which expire and are not part of any release.
    needs: [test, security, desktop, team-server-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: ofintech-desk-*
          merge-multiple: true
      - name: Release notes from the changelog
        env:
          # the same test the packaging step uses; the secret's value never reaches the shell
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " ver " " { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          if [ "$SIGNED" != "true" ]; then
            cat .github/unsigned-install.md >> notes.md   # what a person actually has to do, not just a warning
          fi
          ls -l installers
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: installers/*
          fail_on_unmatched_files: true

  team-server-image:
    needs: [test, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build Team Server image
        run: docker build -f server/Dockerfile -t ofintech-desk:ci .
      - name: Scan the image for known vulnerabilities (Trivy)
        # Trivy's own image, like the gitleaks step; pin the tag to a release once a maintainer has checked the
        # current one (the audit environment could not query Docker Hub).
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress ofintech-desk:ci
