# Generates package-lock.json for ui/ and desktop/ on a runner with registry access and commits them to the branch,
# so that every later install is reproducible (npm ci). Run it by hand from the Actions tab (or `gh workflow run
# lockfiles.yml`) after changing a package.json; the build workflow then installs from the lockfiles.
name: lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Generate the lockfiles
        run: |
          (cd ui && npm install --package-lock-only --no-audit --no-fund)
          (cd desktop && npm install --package-lock-only --no-audit --no-fund)
      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/package-lock.json desktop/package-lock.json
          git diff --cached --quiet && { echo "lockfiles unchanged"; exit 0; }
          git commit -m "Record the resolved npm dependency versions in lockfiles" \
            -m "Generated by the lockfiles workflow so installs are reproducible and auditable (audit OB-17)."
          git push
