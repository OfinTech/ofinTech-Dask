# Runs the browser session tests (OP-12) against a real engine with the built UI and uploads the evidence
# (JSON summary and screenshots) as a workflow artifact. The evidence belongs to the release record, which is not
# published, because a reproduction is as useful to an attacker as to a reviewer (SECURITY.md). Run it by hand
# from the Actions tab or with
# `gh workflow run session-evidence.yml`. The same tests also gate every push (build.yml).
name: session-evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
      - name: Browser session tests
        run: |
          pip install -r engine/requirements.txt playwright==1.63.0
          python -m playwright install --with-deps chromium
          python e2e/session_browser.py e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: session-evidence
          path: e2e-output/session
          retention-days: 30
