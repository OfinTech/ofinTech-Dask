<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>Connect to a Team Server</title>
  <link rel="stylesheet" href="connect.css" />
</head>
<body>
  <main>
    <h1>Connect to a Team Server</h1>
    <p>Your team's OfinTech Desk server lets colleagues share workspaces, approvals and dashboards, and receives
      WhatsApp and Telegram messages around the clock. Ask your administrator for its address.</p>
    <form id="form">
      <label for="url">Server address</label>
      <input id="url" type="url" placeholder="https://desk.yourcompany.com" required />
      <p id="error" role="alert"></p>
      <div class="row">
        <button type="button" id="local">Work on this computer</button>
        <button type="submit" class="primary">Connect</button>
      </div>
    </form>
  </main>
  <script src="connect.js"></script>
</body>
</html>
