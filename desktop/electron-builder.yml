appId: ai.ofintech.desk
productName: OfinTech Desk
copyright: Copyright © 2026 OfinTech
directories:
  output: release
  buildResources: build
# The shell has no runtime dependencies: package.json lists only devDependencies, and `files` below ships
# dist, static and package.json without node_modules. @electron/rebuild therefore has nothing to rebuild, and on
# macOS it does not merely do nothing -- it searches for node modules, finds none, and the build stops with
# "<projectDir> not a file". Turning it off removes a step that could only ever fail here.
npmRebuild: false
files:
  - dist/**
  - static/**
  - package.json
extraResources:
  - from: ../engine/dist/desk-engine
    to: engine
  - from: ../ui/dist
    to: ui
asar: true
protocols:
  - name: OfinTech Desk link
    schemes: [ofintech-desk]
mac:
  category: public.app-category.finance
  hardenedRuntime: true
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office;Finance
  mimeTypes: [x-scheme-handler/ofintech-desk]
  target: [AppImage, deb]
