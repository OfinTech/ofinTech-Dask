# The deploy webhook, next to the website. GitHub calls https://<site>/hooks/deploy on every push; when a push to
# main changes landing/, it pulls the repository and rebuilds the website container. See README.md.
#   docker compose -f docker-compose.yml -f docker-compose.desk.yml -f docker-compose.webhook.yml up -d --build
services:
  hook:
    build: ./deploy
    image: ofintech-landing-hook:latest
    restart: unless-stopped
    env_file: deploy/webhook.env
    volumes:
      # The Docker socket lets the hook rebuild the landing container. Whoever controls this container controls
      # Docker on the host, so it accepts only signed deliveries and has no published port.
      - /var/run/docker.sock:/var/run/docker.sock
      # The checkout, mounted at the same path so compose resolves the build context the same way as on the host.
      - ${REPO_DIR:?set REPO_DIR to the website checkout, the same as in deploy/webhook.env}:${REPO_DIR}
      # Read-only deploy key for a private repository (optional): uncomment and see README.md.
      # - ./deploy/ssh:/root/.ssh:ro
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    networks:
      default: {}
      desk:
        aliases: [ofintech-landing-hook]

networks:
  desk:
    external: true
    name: ofintech-desk_default
