# Monitoring for an OfinTech Desk Team Server: Prometheus (metrics, rules), Alertmanager (routing), Grafana (dashboards).
# Run next to the server's own compose file (paths below are relative to server/, the first -f file), on the same
# project network; nothing here is published to the internet:
#
#   echo "DESK_METRICS_TOKEN=$(openssl rand -hex 32)" >> server/.env           # the engine accepts it on /api/admin/metrics
#   grep DESK_METRICS_TOKEN server/.env | cut -d= -f2- > deploy/monitoring/secrets/metrics_token
#   printf '%s' 'https://<your receiver>' > deploy/monitoring/secrets/alert_webhook_url   # see alertmanager.yml
#   GRAFANA_ADMIN_PASSWORD=... docker compose -f server/docker-compose.yml \
#       -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Grafana listens on 127.0.0.1:3000 only (reach it through SSH or your VPN). Prometheus and Alertmanager have no
# published ports. Retention: 30 days of metrics. See reports/ai-agent-final-release/10_OPERATIONS_RUNBOOK.md.

services:
  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle=false
    volumes:
      - ../deploy/monitoring/prometheus:/etc/prometheus:ro
      - ../deploy/monitoring/secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    depends_on: [engine, alertmanager]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - ../deploy/monitoring/alertmanager:/etc/alertmanager:ro
      - ../deploy/monitoring/secrets/alert_webhook_url:/etc/alertmanager/secrets/alert_webhook_url:ro
      - alertmanager_data:/alertmanager
    expose: ["9093"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ../deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    security_opt: [no-new-privileges:true]

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
