{{- /* If the user brings their own Secret, we must not create a second one. */}}

{{- if not .Values.masterKey.existingSecret }}
{{- /* Generated once, then reused: lookup finds the key already in the cluster. lookup returns nothing with
       helm template and GitOps tools, which is why they need masterKey.existingSecret. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $old }}
  master-key: {{ index $old.data "master-key" }}
  {{- else }}
  master-key: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc }}
  {{- end }}
{{- end }}
