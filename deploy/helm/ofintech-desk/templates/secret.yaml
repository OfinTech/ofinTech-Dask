{{- /* Look in the cluster: does our Secret already exist? */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  annotations:
    helm.sh/resource-policy: keep  
type: Opaque
data:
  {{- if $old }}
  master-key: {{ index $old.data "master-key" }}   
  {{- else }}
  master-key: {{ randBytes 32 | replace "+" "-" | replace "/" "_" | b64enc }}  
  {{- end }}