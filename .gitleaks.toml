# gitleaks configuration (CI "security" job). Default rules plus an allow-list for values that are not secrets.
# Add an entry only with the reason written next to it; the audit roadmap (docs/audit/08) tracks these exceptions.

title = "OfinTech Desk"

[extend]
useDefault = true

[allowlist]
description = "Published example credentials and test fixtures"
regexes = [
  # AWS's own documentation example key pair, used only to check the SigV4 signer against AWS's published vectors
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
  # fake tokens that test fixtures hand to mocked services
  '''[A-Za-z0-9_-]*_test_token_[A-Za-z0-9_-]*''',
  # the bytes 0x00..0x1f, base64: the test master key of tests/test_accounts.py
  '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''',
  # a password the memory test offers so that the engine refuses to remember it
  '''Gulf-2026-secret''',
  # Odoo API keys the connector tests send to a mocked Odoo
  '''(wrong|legacy|adapter)-(secret-)?key(-[0-9]+)?''',
  # the placeholder of the example accounting adapter, named as such
  '''change-me''',
  # canary values the leakage tests plant to prove they never reach logs or responses
  '''[A-Za-z0-9-]*NEVER-IN-LOGS[A-Za-z0-9-]*''',
]
stopwords = ["example", "fake", "test-only"]
